name: Build UK Editing Academy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract V64 project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "UK_Editing_Academy_V64_Phone_Cloud_Build_Pack.zip" -d appsrc
          SRC=$(find appsrc -type f -name pubspec.yaml -printf '%h\n' | head -n 1)
          test -n "$SRC"
          cp -a "$SRC"/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android files
        run: flutter create . --platforms=android --project-name uk_editing_academy

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --dart-define=USE_FIREBASE=false

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: uk-editing-academy-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
