name: Build UK Editing Academy

on:
  workflow_dispatch:
  push:
    paths:
      - 'UK_Editing_Academy_V64_Phone_Cloud_Build_Pack.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract V64 project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "UK_Editing_Academy_V64_Phone_Cloud_Build_Pack.zip" -d appsrc
          SRC=$(find appsrc -type f -name pubspec.yaml -printf '%h\n' | head -n 1)
          echo "Project found at: $SRC"
          cp -a "$SRC"/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --dart-define=USE_FIREBASE=false

      - name: Build AAB
        run: flutter build appbundle --debug --dart-define=USE_FIREBASE=false

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: uk-editing-academy-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Save AAB
        uses: actions/upload-artifact@v4
        with:
          name: uk-editing-academy-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
