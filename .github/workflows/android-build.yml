name: Build UK Editing Academy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -printf "%s %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
          echo "Using ZIP: $ZIP"
          test -n "$ZIP"
          rm -rf appsrc
          mkdir appsrc
          unzip -q "$ZIP" -d appsrc
          SRC=$(find appsrc -type f -name pubspec.yaml -printf '%h\n' | head -n 1)
          test -n "$SRC"
          cp -a "$SRC"/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android files
        run: flutter create . --platforms=android --project-name uk_editing_academy

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --dart-define=USE_FIREBASE=false

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: uk-editing-academy-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
